<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JosTEL: Template Hub</title>
    <!-- Tailwind CSS for sleek, modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Vue.js for reactivity -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- docx.js for Word document generation -->
    <script src="https://unpkg.com/docx@7.3.0/build/index.js"></script>
    <!-- FileSaver.js for downloading the file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            500: '#1e3a8a',
                            600: '#1e40af',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: #f1f5f9;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .slide-enter-active,
        .slide-leave-active {
            transition: all 0.3s ease;
        }

        .slide-enter-from,
        .slide-leave-to {
            opacity: 0;
            transform: translateY(-20px);
        }
    </style>
</head>

<body>
    <div id="app" class="min-h-screen p-4 md:p-8">
        <div class="max-w-5xl mx-auto">
            <!-- Header -->
            <header
                class="mb-8 text-center flex flex-col justify-center items-center bg-white p-8 rounded-2xl shadow-sm border border-gray-100 relative">
                <img src="./jostel_logo.png" alt="Jostel Logo" class="h-20 mb-3 object-contain"
                    onerror="this.style.display='none'">
                <div>
                    <h1 class="text-3xl font-bold text-brand-500 tracking-tight">JosTEL: Template Hub</h1>
                    <p class="text-gray-500 mt-2">Easily feed questions and export properly formatted Moodle Word files.
                    </p>
                </div>
                <div class="mt-6 flex gap-3 flex-wrap justify-center">
                    <label class="cursor-pointer px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-lg shadow-sm transition-all focus:ring-4 focus:ring-purple-100 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <span>Import TXT File</span>
                        <input type="file" class="hidden" accept=".txt,.csv" @change="importAikenFile">
                    </label>
                    <button @click="showTemplateModal = true"
                        class="px-5 py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg shadow-sm transition-all focus:ring-4 focus:ring-blue-100 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span>Blank Template</span>
                    </button>
                    <button @click="addQuestion"
                        class="px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-medium rounded-lg shadow-sm transition-all focus:ring-4 focus:ring-brand-100">
                        + Add Question
                    </button>
                    <!--<button @click="generateMoodleXML" v-if="questions.length > 0"
                        class="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-medium rounded-lg shadow-sm transition-all focus:ring-4 focus:ring-orange-100 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                        </svg>
                        Moodle XML
                    </button>-->
                    <button @click="generateDocx" v-if="questions.length > 0"
                        class="px-5 py-2.5 bg-green-500 hover:bg-green-600 text-white font-medium rounded-lg shadow-sm transition-all focus:ring-4 focus:ring-green-100 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        DOCX
                    </button>
                </div>
            </header>

            <!-- Course Meta -->
            <div class="glass-panel p-6 rounded-2xl mb-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Course Code & Title</label>
                        <input v-model="courseCode" type="text" placeholder="e.g. 25UBU501 - Principles of Management"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Template Type (Naming)</label>
                        <input v-model="templateName" type="text" placeholder="e.g. Component-I_K1_K2"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                    </div>
                </div>
            </div>

            <!-- Questions List -->
            <transition-group name="slide" tag="div" class="space-y-6">
                <div v-for="(q, index) in questions" :key="q.id" class="glass-panel p-6 rounded-2xl relative group">
                    <button @click="removeQuestion(index)"
                        class="absolute top-4 right-4 text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors opacity-0 group-hover:opacity-100"
                        title="Remove Question">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                            </path>
                        </svg>
                    </button>

                    <div class="flex items-center gap-4 mb-4">
                        <span class="bg-gray-100 text-gray-700 text-sm font-bold px-3 py-1 rounded-full">Q-{{
                            String(index+1).padStart(2, '0') }}</span>

                        <select v-model="q.level" @change="updateMarks(q)"
                            class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm font-medium focus:ring-brand-500 focus:border-brand-500 outline-none bg-white">
                            <option value="K1">Level K1</option>
                            <option value="K2">Level K2</option>
                            <option value="K3">Level K3</option>
                        </select>
                        <div class="text-sm text-gray-500">Marks: <input v-model.number="q.marks" type="number" min="1"
                                class="w-16 px-2 py-1 border border-gray-300 rounded-md text-center outline-none"></div>
                    </div>

                    <div class="mb-5">
                        <textarea v-model="q.text" rows="2" placeholder="Write your question here..."
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all resize-none font-medium text-gray-800"></textarea>
                    </div>

                    <div class="space-y-3">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Options (Select the correct
                            one)</label>
                        <div v-for="(opt, optIndex) in q.options" :key="optIndex"
                            class="flex flex-col md:flex-row items-center gap-3 bg-white p-2 border border-gray-100 rounded-lg shadow-sm">
                            <div class="flex items-center justify-center pl-2">
                                <input type="radio" :name="'correct_' + q.id" :value="optIndex" v-model="q.correctIndex"
                                    class="w-5 h-5 text-brand-600 bg-gray-100 border-gray-300 focus:ring-brand-500 cursor-pointer">
                            </div>
                            <input v-model="opt.text" type="text" :placeholder="'Option ' + (optIndex + 1)"
                                class="flex-1 px-4 py-2 bg-transparent border-none outline-none focus:ring-0">
                            <input v-model="opt.feedback" type="text" placeholder="Feedback (optional)"
                                class="flex-1 px-4 py-2 text-sm text-gray-500 bg-gray-50 border border-gray-200 rounded-md outline-none focus:border-brand-300 hidden md:block">
                        </div>
                    </div>
                </div>
            </transition-group>

            <div v-if="questions.length === 0"
                class="text-center py-20 bg-white rounded-2xl border border-gray-200 border-dashed">
                <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                    </path>
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900">No questions added</h3>
                <p class="mt-1 text-sm text-gray-500">Get started by adding a new question.</p>
                <button @click="addQuestion"
                    class="mt-4 px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-brand-600 bg-brand-50 hover:bg-brand-100 transition-colors">
                    Add Question
                </button>
            </div>

            <div class="mt-8 text-center text-sm text-gray-400">
                <p>Generates Word Document matching the Jostel College template structure.</p>
            </div>

            <!-- Template Generator Modal -->
            <div v-if="showTemplateModal"
                class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
                <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 md:p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">📄 Blank Template Builder
                        </h2>
                        <button @click="showTemplateModal = false" class="text-gray-400 hover:text-gray-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Default Bloom's Level</label>
                            <select v-model="templateLevel"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="K1">K1 (1 Mark)</option>
                                <option value="K2">K2 (2 Marks)</option>
                                <option value="K3">K3 (3 Marks)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Number of Blank
                                Questions</label>
                            <input v-model.number="templateCount" type="number" min="1" max="150"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <button @click="generateTemplate"
                            class="w-full mt-2 px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm transition-all focus:ring-4 focus:ring-blue-100">
                            Create Blank Boxes
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    courseCode: '',
                    templateName: 'Component-I_K1_K2_Template',
                    questions: [],
                    // Template State
                    showTemplateModal: false,
                    templateLevel: 'K1',
                    templateCount: 10
                }
            },
            methods: {
                addQuestion() {
                    this.questions.push({
                        id: Date.now() + Math.random(),
                        text: '',
                        level: 'K1',
                        marks: 1,
                        correctIndex: 0,
                        options: [
                            { text: '', feedback: '' },
                            { text: '', feedback: '' },
                            { text: '', feedback: '' },
                            { text: '', feedback: '' }
                        ]
                    });
                    // smooth scroll to bottom
                    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
                },
                removeQuestion(index) {
                    this.questions.splice(index, 1);
                },
                updateMarks(q) {
                    if (q.level === 'K1') q.marks = 1;
                    else if (q.level === 'K2') q.marks = 2;
                    else if (q.level === 'K3') q.marks = 3;
                },
                generateTemplate() {
                    let defaultMarks = 1;
                    if (this.templateLevel === 'K2') defaultMarks = 2;
                    if (this.templateLevel === 'K3') defaultMarks = 3;

                    const count = parseInt(this.templateCount) || 1;

                    for (let i = 0; i < count; i++) {
                        this.questions.push({
                            id: Date.now() + Math.random() + i,
                            text: '',
                            level: this.templateLevel,
                            marks: defaultMarks,
                            correctIndex: 0,
                            options: [
                                { text: '', feedback: '' },
                                { text: '', feedback: '' },
                                { text: '', feedback: '' },
                                { text: '', feedback: '' }
                            ]
                        });
                    }
                    this.showTemplateModal = false;
                    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 150);
                },
                importAikenFile(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const text = e.target.result;
                        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        
                        let currentQ = null;
                        const parsedQuestions = [];
                        
                        for (let i = 0; i < lines.length; i++) {
                            const line = lines[i];
                            
                            // Answer line
                            if (line.toUpperCase().startsWith('ANSWER:')) {
                                if (currentQ) {
                                    const correctLetter = line.split(':')[1].trim().toUpperCase();
                                    const val = correctLetter.charCodeAt(0) - 65;
                                    currentQ.correctIndex = (val >= 0 && val < 4) ? val : 0;
                                    
                                    while(currentQ.options.length < 4) {
                                        currentQ.options.push({ text: '', feedback: '' });
                                    }
                                    parsedQuestions.push(currentQ);
                                    currentQ = null;
                                }
                            } 
                            // Option line
                            else if (/^[A-Z][.)]\s+(.*)/i.test(line)) {
                                if (currentQ) {
                                    const match = line.match(/^[A-Z][.)]\s+(.*)/i);
                                    currentQ.options.push({ text: match[1].trim(), feedback: '' });
                                }
                            }
                            // Question line
                            else {
                                if (!currentQ) {
                                    currentQ = {
                                        id: Date.now() + Math.random() + i,
                                        text: line,
                                        level: 'K1', // Default
                                        marks: 1, 
                                        correctIndex: 0,
                                        options: []
                                    };
                                } else {
                                    currentQ.text += "\n" + line;
                                }
                            }
                        }
                        
                        if (parsedQuestions.length > 0) {
                            this.questions = [...this.questions, ...parsedQuestions];
                            alert(`Success! Fetched ${parsedQuestions.length} questions from the file.`);
                            setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
                        } else {
                            alert("Could not extract any questions. Make sure it's in standard Aiken format (Question text, A. option, B. option, and ANSWER: A).");
                        }
                        event.target.value = '';
                    };
                    reader.readAsText(file);
                },
                async generateDocx() {
                    try {
                        const docz = window.docx;
                        const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, HeadingLevel, AlignmentType } = docz;

                        const children = [];

                        // Template Title
                        children.push(
                            new Paragraph({
                                text: this.templateName || "Component 1 – QUIZ Template",
                                heading: HeadingLevel.HEADING_1,
                                alignment: AlignmentType.CENTER,
                                spacing: { after: 200 }
                            })
                        );

                        if (this.courseCode) {
                            children.push(
                                new Paragraph({
                                    children: [
                                        new TextRun({ text: `[Enter the Course Code: ${this.courseCode}]`, bold: true, color: "000000" })
                                    ],
                                    spacing: { after: 200 }
                                })
                            );
                        }

                        // Group questions by Level (K1, K2, etc.)
                        const levels = [...new Set(this.questions.map(q => q.level))];

                        for (const level of Object.keys({ K1: 1, K2: 2, K3: 3 })) {
                            const levelQs = this.questions.filter(q => q.level === level);
                            if (levelQs.length === 0) continue;

                            children.push(new Paragraph({
                                children: [new TextRun({ text: `[${level} – ${this.courseCode || 'Enter course code'}]`, bold: true })],
                                spacing: { before: 200, after: 200 }
                            }));

                            levelQs.forEach((q, index) => {
                                const qNumber = index + 1;
                                // Q-01 - K1 (MC)
                                children.push(
                                    new Paragraph({
                                        text: "Quiz Category",
                                        heading: HeadingLevel.HEADING_1
                                    }),
                                    new Paragraph({ text: "" }),
                                    new Paragraph({
                                        text: `Q-${String(qNumber).padStart(2, '0')} – ${level} (MC)`,
                                        heading: docz.HeadingLevel.HEADING_2,
                                        spacing: { before: 100, after: 100 }
                                    })
                                );

                                // The Moodle Format Table
                                const tableBorder = { style: docz.BorderStyle.SINGLE, size: 1, color: "000000" };
                                const tableBorders = {
                                    top: tableBorder, bottom: tableBorder, left: tableBorder, right: tableBorder,
                                    insideHorizontal: tableBorder, insideVertical: tableBorder
                                };

                                const rows = [];

                                // Row 1: Question Text & MC type
                                rows.push(new docz.TableRow({
                                    tableHeader: true,
                                    children: [
                                        new docz.TableCell({
                                            children: [new docz.Paragraph({ text: q.text || "[Empty Question]", style: "Cell" })],
                                            columnSpan: 3, borders: tableBorders
                                        }),
                                        new docz.TableCell({
                                            children: [new docz.Paragraph({ text: "MC", style: "QFType" })],
                                            borders: tableBorders
                                        })
                                    ]
                                }));

                                // Row 2: Default Mark
                                rows.push(new docz.TableRow({
                                    tableHeader: true,
                                    children: [
                                        new docz.TableCell({
                                            children: [new docz.Paragraph({ text: "Default mark:", style: "TableRowHead" })],
                                            columnSpan: 3, borders: tableBorders
                                        }),
                                        new docz.TableCell({
                                            children: [new docz.Paragraph({ text: String(q.marks), style: "Cell" })],
                                            borders: tableBorders
                                        })
                                    ]
                                }));

                                // Row 3: Headers
                                rows.push(new docz.TableRow({
                                    tableHeader: true,
                                    children: [
                                        new docz.TableCell({ children: [new docz.Paragraph({ text: "#", style: "QFOptionReset" })], borders: tableBorders }),
                                        new docz.TableCell({ children: [new docz.Paragraph({ text: "Answers", style: "TableHead" })], borders: tableBorders }),
                                        new docz.TableCell({ children: [new docz.Paragraph({ text: "Feedback", style: "TableHead" })], borders: tableBorders }),
                                        new docz.TableCell({ children: [new docz.Paragraph({ text: "Grade", style: "TableHead" })], borders: tableBorders })
                                    ]
                                }));

                                // Option Rows
                                const optionChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                                q.options.forEach((opt, optIdx) => {
                                    const isCorrect = q.correctIndex === optIdx;
                                    const grade = isCorrect ? "100" : "0";
                                    const optLabel = optionChars[optIdx] + ".";
                                    rows.push(new docz.TableRow({
                                        children: [
                                            new docz.TableCell({ children: [new docz.Paragraph({ text: optLabel, style: "QFOption" })], borders: tableBorders }),
                                            new docz.TableCell({ children: [new docz.Paragraph({ text: opt.text || "", style: "Cell" })], borders: tableBorders }),
                                            new docz.TableCell({ children: [new docz.Paragraph({ text: opt.feedback || "", style: "QFFeedback" })], borders: tableBorders }),
                                            new docz.TableCell({ children: [new docz.Paragraph({ text: grade, style: "QFGrade" })], borders: tableBorders })
                                        ]
                                    }));
                                });

                                const table = new docz.Table({
                                    rows: rows,
                                    width: { size: 100, type: docz.WidthType.PERCENTAGE },
                                    borders: tableBorders
                                });

                                children.push(
                                    table,
                                    new docz.Paragraph({ text: "" })
                                );
                            });
                        }

                        const doc = new Document({
                            creator: "Moodle Quiz Generator",
                            language: "en-US",
                            customProperties: [
                                { name: "moodleLanguage", value: "en" },
                                { name: "moodleRelease", value: "3.6" },
                                { name: "moodleURL", value: "http://www.moodle2word.net/" },
                                { name: "moodleCourseID", value: "1" },
                                { name: "moodleQuestionSeqNum", value: "1" },
                                { name: "moodleCategory", value: "Default" }
                            ],
                            styles: {
                                default: {
                                    document: {
                                        run: {
                                            language: "en-US"
                                        }
                                    }
                                },
                                paragraphStyles: [
                                    { id: "QFOption", name: "QFOption", basedOn: "Normal", next: "Normal", run: {} },
                                    { id: "Cell", name: "Cell", basedOn: "Normal", next: "Normal", run: {} },
                                    { id: "QFFeedback", name: "QFFeedback", basedOn: "Normal", next: "Normal", run: {} },
                                    { id: "QFGrade", name: "QFGrade", basedOn: "Normal", next: "Normal", run: {} },
                                    { id: "QFType", name: "QFType", basedOn: "Normal", next: "Normal", run: {} },
                                    { id: "TableRowHead", name: "TableRowHead", basedOn: "Normal", next: "Normal", run: {} },
                                    { id: "TableHead", name: "TableHead", basedOn: "Normal", next: "Normal", run: {} },
                                    { id: "QFOptionReset", name: "QFOptionReset", basedOn: "Normal", next: "Normal", run: {} }
                                ]
                            },
                            sections: [{
                                properties: {},
                                children: children
                            }]
                        });

                        const buffer = await Packer.toBlob(doc);
                        const filename = (this.templateName || "Component-I_K1_K2") + ".docx";
                        saveAs(buffer, filename);
                    } catch (e) {
                        alert("Error generating DOCX: " + e.message);
                        console.error(e);
                    }
                },
                generateMoodleXML() {
                    try {
                        let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<quiz>\n';

                        this.questions.forEach((q, index) => {
                            const qNumber = String(index + 1).padStart(2, '0');
                            const level = q.level;
                            const code = this.courseCode || 'Enter course code';
                            const title = `Q-${qNumber} – ${level} (MC) [${code}]`;

                            xml += `  <question type="multichoice">\n`;
                            xml += `    <name>\n      <text><![CDATA[${title}]]></text>\n    </name>\n`;
                            xml += `    <questiontext format="html">\n`;
                            xml += `      <text><![CDATA[<p>${q.text}</p>]]></text>\n`;
                            xml += `    </questiontext>\n`;
                            xml += `    <defaultgrade>${q.marks}</defaultgrade>\n`;
                            xml += `    <penalty>0.3333333</penalty>\n`;
                            xml += `    <hidden>0</hidden>\n`;
                            xml += `    <single>true</single>\n`;
                            xml += `    <shuffleanswers>true</shuffleanswers>\n`;
                            xml += `    <answernumbering>abc</answernumbering>\n`;

                            q.options.forEach((opt, optIndex) => {
                                const fraction = (q.correctIndex === optIndex) ? "100" : "0";
                                xml += `    <answer fraction="${fraction}" format="html">\n`;
                                xml += `      <text><![CDATA[<p>${opt.text}</p>]]></text>\n`;
                                if (opt.feedback) {
                                    xml += `      <feedback format="html">\n`;
                                    xml += `        <text><![CDATA[<p>${opt.feedback}</p>]]></text>\n`;
                                    xml += `      </feedback>\n`;
                                }
                                xml += `    </answer>\n`;
                            });
                            xml += `  </question>\n`;
                        });

                        xml += `</quiz>`;

                        const blob = new Blob([xml], { type: "application/xml;charset=utf-8" });
                        const filename = (this.templateName || "Moodle_Questions") + ".xml";
                        saveAs(blob, filename);
                    } catch (e) {
                        alert("Error generating Moodle XML: " + e.message);
                    }
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
