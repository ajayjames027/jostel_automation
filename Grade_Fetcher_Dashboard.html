<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jostel Grade Fetcher Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a; /* Deep University Blue */
            --primary-hover: #1e40af; 
            --secondary: #3b82f6;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --table-header-bg: #1e3a8a;
            --table-header-text: #ffffff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            line-height: 1.6;
        }

        .dashboard {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            transition: all 0.3s;
        }

        .header { text-align: center; margin-bottom: 2.5rem; border-bottom: 2px solid var(--border-color); padding-bottom: 2rem; }
        .header img { height: 80px; margin-bottom: 1rem; object-fit: contain; }
        .header h1 { font-size: 2.2rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; letter-spacing: -0.5px; }
        .header p { color: var(--text-muted); font-size: 1.1rem; font-weight: 300; }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
        
        label { font-weight: 600; font-size: 0.95rem; color: var(--text-main); }
        
        input[type="text"], input[type="password"], input[type="date"], select {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.9rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }
        
        input:focus, select:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        select option { background: #ffffff; color: var(--text-main); padding: 10px; }

        .btn-generate {
            display: block;
            width: 100%;
            padding: 1.1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-family: inherit;
        }
        .btn-generate:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-generate:active { transform: translateY(0); }
        
        .btn-export {
            display: block;
            width: 100%;
            padding: 0.9rem;
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
        }
        .btn-export:hover { background: #e2e8f0; }

        .status { margin-top: 1.5rem; padding: 1.2rem; border-radius: 8px; display: none; text-align: center; font-weight: 500; font-size: 0.95rem; }
        .status.error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; display: block;}
        .status.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; display: block;}
        .status.loading { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; display: block;}

        .table-container {
            margin-top: 1rem;
            max-height: 450px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        
        .filters-bar {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
            align-items: end;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; background: #ffffff; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
        th { background: var(--table-header-bg); color: var(--table-header-text); position: sticky; top: 0; font-weight: 600; z-index: 10; }
        tr:hover { background: #f8fafc; }
        
        .q-wise-box {
            font-size:0.85rem; 
            max-width:250px; 
            overflow-x:auto; 
            white-space:nowrap; 
            padding:0.4rem 0.6rem; 
            background:#f1f5f9; 
            border: 1px solid #e2e8f0;
            border-radius:4px;
            color: #475569;
        }

        /* Multi-step logic */
        #step2 { display: none; margin-top: 1.5rem; padding-top: 1.5rem; }
        #resultsWrapper { display: none; margin-top: 2rem; }
        .hidden-row { display: none !important; }
        
        .section-title {
            margin-bottom: 1.2rem;
            color: var(--primary);
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <img src="./jostel_logo.png" alt="Jostel Logo" onerror="this.style.display='none'">
            <h1>Live Grade Fetcher</h1>
            <p>Connect securely using your token to explore all quizzes.</p>
        </div>

        <!-- Step 1: Connect -->
        <div id="step1">
            <div class="form-grid">
                <div class="input-group">
                    <label>Moodle API Token</label>
                    <input type="password" id="apiToken" value="20346d2c25c71285ffc0f147a3f9eab8">
                </div>
                <div class="input-group">
                    <label>Moodle Base URL</label>
                    <input type="text" id="moodleUrl" value="https://service.sjctni.edu/jostel/moodle">
                </div>
            </div>
            <button class="btn-generate" id="connectBtn">Connect to Moodle & Load Quizzes</button>
        </div>

        <div class="status" id="statusMessage"></div>

        <!-- Step 2: Select Quiz and Fetch -->
        <div id="step2">
            <div class="input-group" style="margin-bottom: 1.5rem;">
                <!-- Filter Quizzes -->
                <label>Course/Class Filter (Search Quizzes)</label>
                <input type="text" id="quizSearchInput" placeholder="Type a course or quiz name to filter..." style="margin-bottom: 1rem;">

                <label>📅 Or Find Quiz by Date Attempted / Opened</label>
                <input type="date" id="quizDateSearch" style="margin-bottom: 1.5rem;">
                
                <select id="quizSelect">
                    <option value="" disabled selected>-- Select a Quiz --</option>
                </select>
            </div>
            
            <button class="btn-generate" id="fetchBtn" style="margin-bottom: 1rem;">Fetch Live Grades</button>

            <!-- FETCH BY STUDENT REPORT -->
            <div style="border-top: 1px solid var(--border-color); padding-top: 1.5rem; margin-top: 2rem;">
                <h3 class="section-title">Global Transcript Search</h3>
                <div class="input-group" style="margin-bottom: 1.2rem;">
                    <label>Find specific records by Register Number / Username</label>
                    <input type="text" id="studentSearchInput" placeholder="Enter Reg No, e.g. 24UCO102">
                </div>
                <button class="btn-generate" id="fetchStudentBtn" style="background: var(--secondary); border: 1px solid #2563eb;">Search Student Transcript</button>
            </div>
        </div>

        <!-- Results & Filtering Table -->
        <div id="resultsWrapper">
            <div class="filters-bar">
                <div class="input-group">
                    <label>🔍 Smart Filter</label>
                    <input type="text" id="tableFilterInput" placeholder="Filter by Register Number/State...">
                </div>
                <div class="input-group">
                    <label>📅 Filter Existing Below</label>
                    <input type="date" id="dateFilterInput">
                </div>
                <div class="input-group">
                    <label>Quick Export</label>
                    <button class="btn-export" id="exportBtn" style="margin: 0; padding: 1rem;">Export CSV</button>
                </div>
            </div>

            <div class="table-container" id="tableContainer">
                <table id="gradesTable">
                    <thead>
                        <tr>
                            <th>Reg. No / Name</th>
                            <th>Total Grade</th>
                            <th>Q-Wise Details</th>
                            <th>Status</th>
                            <th>Date Finished</th>
                        </tr>
                    </thead>
                    <tbody id="gradesBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentGradesData = [];
        let allQuizzes = [];
        let apiToken = "";
        let apiUrl = "";

        // UI Helpers
        function showStatus(type, message) {
            const statusBox = document.getElementById('statusMessage');
            statusBox.className = `status ${type}`;
            statusBox.innerHTML = message;
        }

        function formatUnixTime(unixStamp) {
            if (!unixStamp || unixStamp === 0) return "Not Finished";
            const d = new Date(unixStamp * 1000);
            return d.toLocaleDateString() + " " + d.toLocaleTimeString();
        }

        // STEP 1: LOAD QUIZZES
        document.getElementById('connectBtn').addEventListener('click', async () => {
            apiToken = document.getElementById('apiToken').value.trim();
            const baseUrl = document.getElementById('moodleUrl').value.trim().replace(/\/$/, "");
            apiUrl = `${baseUrl}/webservice/rest/server.php`;

            if (!apiToken || !baseUrl) {
                showStatus('error', 'Token and URL are required.'); return;
            }

            showStatus('loading', 'Connecting to Moodle & gathering quizzes...');
            try {
                const res = await fetch(`${apiUrl}?wstoken=${apiToken}&wsfunction=mod_quiz_get_quizzes_by_courses&moodlewsrestformat=json`);
                const data = await res.json();

                if (data.exception) throw new Error(data.message || "Failed to load quizzes");

                allQuizzes = data.quizzes || [];
                if (allQuizzes.length === 0) {
                    showStatus('error', "Connected successfully, but 0 quizzes were found for your account."); return;
                }

                allQuizzes.sort((a,b) => b.id - a.id); 
                populateQuizDropdown(allQuizzes);

                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                showStatus('success', `Successfully loaded ${allQuizzes.length} Quizzes! Select one below.`);
            } catch (err) {
                if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    showStatus('error', `<b>CORS Block / Network Error</b>`);
                } else {
                    showStatus('error', `Error: ${err.message}`);
                }
            }
        });

        // Filter Quizzes Dropdown by Text
        document.getElementById('quizSearchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allQuizzes.filter(quiz => quiz.name.toLowerCase().includes(q));
            populateQuizDropdown(filtered);
        });

        // Filter Quizzes by Date
        document.getElementById('quizDateSearch').addEventListener('change', (e) => {
            const dateQuery = e.target.value; // YYYY-MM-DD
            if (!dateQuery) {
                populateQuizDropdown(allQuizzes);
                return;
            }
            const filtered = allQuizzes.filter(quiz => {
                const qOpen = quiz.timeopen ? new Date(quiz.timeopen * 1000) : null;
                const qClose = (quiz.timeclose && quiz.timeclose > 0) ? new Date(quiz.timeclose * 1000) : null;
                const targetDt = new Date(dateQuery);
                
                const toIso = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : null;
                
                // Direct specific match
                if (toIso(qOpen) === dateQuery) return true;
                
                // Overlap match: if the date falls inside the window
                targetDt.setHours(12, 0, 0, 0); 
                if (qOpen && qClose && targetDt >= qOpen && targetDt <= qClose) return true;
                if (qOpen && !qClose && targetDt >= qOpen) return true;
                
                return false;
            });
            populateQuizDropdown(filtered);
            if (filtered.length === 0) {
                 showStatus('error', 'No quizzes found for this date. Try clearing the date filter.');
            } else {
                 showStatus('success', `Found ${filtered.length} quizzes opened on this date!`);
            }
        });

        function populateQuizDropdown(quizzesArray) {
            const sel = document.getElementById('quizSelect');
            sel.innerHTML = '<option value="" disabled selected>-- Choose a Quiz --</option>';
            quizzesArray.forEach(q => {
                const opt = document.createElement('option');
                opt.value = q.id;
                opt.textContent = `[ID: ${q.id}] ${q.name}`;
                sel.appendChild(opt);
            });
        }

        // STEP 2: FETCH GRADES
        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const quizId = document.getElementById('quizSelect').value;
            const resWrap = document.getElementById('resultsWrapper');
            const tbody = document.getElementById('gradesBody');
            
            resWrap.style.display = 'none';
            tbody.innerHTML = '';
            currentGradesData = [];
            document.getElementById('tableFilterInput').value = "";

            if (!quizId) {
                showStatus('error', 'Please select a quiz from the dropdown first!'); return;
            }

            try {
                const quizObj = allQuizzes.find(q => q.id == quizId);
                const courseId = quizObj ? quizObj.course : null;
                if (!courseId) throw new Error("Could not determine Course ID for this quiz.");

                showStatus('loading', `Fetching enrolled students for course ${courseId}...`);
                
                const usersRes = await fetch(`${apiUrl}?wstoken=${apiToken}&wsfunction=core_enrol_get_enrolled_users&moodlewsrestformat=json&courseid=${courseId}`);
                const students = await usersRes.json();
                
                if (students.exception) throw new Error(students.message);
                if (!Array.isArray(students) || students.length === 0) {
                     showStatus('error', "No students found in this course."); return;
                }

                showStatus('loading', `Found ${students.length} enrolled users. Pulling individual grades... (This may take a few seconds)`);

                let allStudentAttempts = [];

                // Fetch attempts sequentially to avoid rate limits and update user visually
                let progressCount = 0;
                for (let i = 0; i < students.length; i++) {
                    const student = students[i];
                    const studentId = student.id;
                    const studentName = student.fullname;
                    const studentReg = student.idnumber || student.username || ""; // Best effort for Reg Number
                    
                    progressCount++;
                    showStatus('loading', `Checking grades for student ${progressCount} of ${students.length}...`);
                    
                    const attemptRes = await fetch(`${apiUrl}?wstoken=${apiToken}&wsfunction=mod_quiz_get_user_attempts&moodlewsrestformat=json&quizid=${quizId}&status=all&userid=${studentId}`);
                    const attemptData = await attemptRes.json();
                    
                    if (attemptData.attempts && attemptData.attempts.length > 0) {
                        for (let att of attemptData.attempts) {
                            att.fullname = studentName;
                            att.usernameStr = studentReg;
                            
                            // Fetch detailed Q-wise marks for this attempt!
                            try {
                                const revRes = await fetch(`${apiUrl}?wstoken=${apiToken}&wsfunction=mod_quiz_get_attempt_review&moodlewsrestformat=json&attemptid=${att.id}`);
                                const revData = await revRes.json();
                                let qDetails = [];
                                if (revData.questions) {
                                    revData.questions.forEach(q => {
                                        let cleanMark = q.mark !== null && q.mark !== undefined ? parseFloat(q.mark).toFixed(1) : '0';
                                        let cleanMax = q.maxmark ? parseFloat(q.maxmark).toFixed(1) : '1';
                                        qDetails.push(`Q${q.slot}: ${cleanMark}/${cleanMax}`);
                                    });
                                }
                                att.qWiseStr = qDetails.length > 0 ? qDetails.join(' | ') : 'N/A';
                            } catch(e) {
                                att.qWiseStr = 'Details Unavailable';
                            }
                            
                            allStudentAttempts.push(att);
                        }
                    }
                }

                if (allStudentAttempts.length === 0) {
                    showStatus('error', `0 matching grades found! None of the ${students.length} users have attempted this test yet.`);
                    return;
                }

                allStudentAttempts.forEach(att => {
                    // Only map if it exists
                    const gradeVal = att.sumgrades !== null ? att.sumgrades : 'Ungraded';
                    const dateStr = formatUnixTime(att.timefinish);
                    const state = att.state || "unknown";
                    
                    const dt = (att.timefinish && att.timefinish !== 0) ? new Date(att.timefinish * 1000) : null;
                    let isoDate = "";
                    if (dt) {
                        const year = dt.getFullYear();
                        const month = String(dt.getMonth() + 1).padStart(2, '0');
                        const day = String(dt.getDate()).padStart(2, '0');
                        isoDate = `${year}-${month}-${day}`;
                    }

                    // Prefer register number, fallback to fullname, then userid fallback
                    const finalUser = att.usernameStr ? `${att.usernameStr} - ${att.fullname}` : (att.fullname ? `${att.fullname} (ID: ${att.userid})` : att.userid);
                    const qWise = att.qWiseStr || 'N/A';

                    currentGradesData.push({
                        userid: finalUser,
                        grade: gradeVal,
                        qWise: qWise,
                        state: state,
                        date: dateStr,
                        isoDate: isoDate,
                        searchString: `${finalUser} ${gradeVal} ${qWise} ${state} ${dateStr}`.toLowerCase()
                    });

                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${finalUser}</td><td><b style="color:var(--primary); font-size: 1.05em">${gradeVal}</b></td><td><div class="q-wise-box">${qWise}</div></td><td>${state}</td><td>${dateStr}</td>`;
                    tbody.appendChild(tr);
                });

                showStatus('success', `Pulled ${currentGradesData.length} records successfully! Use the Smart Filter to sort them.`);
                resWrap.style.display = 'block';

            } catch (error) {
                showStatus('error', `Failed to fetch grades: ${error.message}`);
            }
        });

        // SMART TABLE FILTER LOGIC
        function applyFilters() {
            const query = document.getElementById('tableFilterInput').value.toLowerCase();
            const dateQuery = document.getElementById('dateFilterInput').value;
            const rows = document.getElementById('gradesBody').getElementsByTagName('tr');
            
            for (let i = 0; i < rows.length; i++) {
                let showRow = true;
                const rowData = currentGradesData[i];
                
                // Text search filter
                if (query && !rowData.searchString.includes(query)) {
                    showRow = false;
                }
                
                // Date match filter
                if (dateQuery && rowData.isoDate !== dateQuery) {
                    showRow = false;
                }

                if (showRow) {
                    rows[i].classList.remove('hidden-row');
                } else {
                    rows[i].classList.add('hidden-row');
                }
            }
        }
        
        document.getElementById('tableFilterInput').addEventListener('input', applyFilters);
        document.getElementById('dateFilterInput').addEventListener('change', applyFilters);

        // --- STUDENT GLOBAL SUMMARY LOGIC ---
        document.getElementById('fetchStudentBtn').addEventListener('click', async () => {
            const regNo = document.getElementById('studentSearchInput').value.trim().toLowerCase();
            if (!regNo) {
                showStatus('error', 'Please enter a Register Number / Username first.'); return;
            }

            const resWrap = document.getElementById('resultsWrapper');
            const tbody = document.getElementById('gradesBody');
            resWrap.style.display = 'none';
            tbody.innerHTML = '';
            currentGradesData = [];
            document.getElementById('tableFilterInput').value = "";

            try {
                showStatus('loading', `🔍 Searching all courses for student: ${regNo}...`);

                // 1. Find User ID by scanning unique courses
                let targetUserId = null;
                let targetUserName = null;
                const uniqueCourses = [...new Set(allQuizzes.map(q => q.course))];
                
                for (let i = 0; i < uniqueCourses.length; i++) {
                    const cid = uniqueCourses[i];
                    try {
                        const uRes = await fetch(`${apiUrl}?wstoken=${apiToken}&wsfunction=core_enrol_get_enrolled_users&moodlewsrestformat=json&courseid=${cid}`);
                        const students = await uRes.json();
                        if (Array.isArray(students)) {
                            const found = students.find(s => (s.idnumber || "").toLowerCase() === regNo || (s.username || "").toLowerCase() === regNo);
                            if (found) {
                                targetUserId = found.id;
                                targetUserName = found.fullname;
                                break;
                            }
                        }
                    } catch(e) { /* ignore and continue */ }
                }

                if (!targetUserId) {
                    showStatus('error', `Could not find student '${regNo}' in any active courses.`); return;
                }

                // 2. Fetch attempts exactly for this user across ALL quizzes
                showStatus('loading', `Found ${targetUserName}! Scanning ${allQuizzes.length} quizzes for attempts...`);
                let summaryData = [];
                let checkedCount = 0;

                for (let quiz of allQuizzes) {
                    checkedCount++;
                    if (checkedCount % 5 === 0) showStatus('loading', `Found ${targetUserName}! Scanning quizzes (${checkedCount}/${allQuizzes.length})...`);
                    
                    try {
                        const attRes = await fetch(`${apiUrl}?wstoken=${apiToken}&wsfunction=mod_quiz_get_user_attempts&moodlewsrestformat=json&quizid=${quiz.id}&status=all&userid=${targetUserId}`);
                        const attData = await attRes.json();
                        if (attData.attempts && attData.attempts.length > 0) {
                            for (let att of attData.attempts) {
                                // Add quiz info context
                                att.quizName = quiz.name;
                                att.fullname = targetUserName;
                                att.usernameStr = regNo;
                                
                                // Fetch Q-wise
                                try {
                                    const revRes = await fetch(`${apiUrl}?wstoken=${apiToken}&wsfunction=mod_quiz_get_attempt_review&moodlewsrestformat=json&attemptid=${att.id}`);
                                    const revData = await revRes.json();
                                    let qDetails = [];
                                    if (revData.questions) {
                                        revData.questions.forEach(q => {
                                            qDetails.push(`Q${q.slot}: ${q.mark!==null&&q.mark!==undefined?parseFloat(q.mark).toFixed(1):'0'}/${q.maxmark?parseFloat(q.maxmark).toFixed(1):'1'}`);
                                        });
                                    }
                                    att.qWiseStr = qDetails.length > 0 ? qDetails.join(' | ') : 'N/A';
                                } catch(e) { att.qWiseStr = 'N/A'; }
                                
                                summaryData.push(att);
                            }
                        }
                    } catch (e) { /* ignore */ }
                }

                if (summaryData.length === 0) {
                    showStatus('error', `Student ${targetUserName} hasn't attempted any quizzes yet.`); return;
                }

                summaryData.forEach(att => {
                    const gradeVal = att.sumgrades !== null ? att.sumgrades : 'Ungraded';
                    const dateStr = formatUnixTime(att.timefinish);
                    const state = att.state || "unknown";
                    
                    const dt = (att.timefinish && att.timefinish !== 0) ? new Date(att.timefinish * 1000) : null;
                    let isoDate = "";
                    if (dt) {
                        const year = dt.getFullYear();
                        const month = String(dt.getMonth() + 1).padStart(2, '0');
                        const day = String(dt.getDate()).padStart(2, '0');
                        isoDate = `${year}-${month}-${day}`;
                    }

                    // For summary layout, display the quiz name instead of student name (since it's all one student)
                    const displayTitle = `<span style="font-size:0.8rem; color:var(--text-muted); text-transform:uppercase; font-weight:600;">${att.quizName}</span><br/><b>${att.usernameStr}</b> - ${att.fullname}`;
                    const qWise = att.qWiseStr || 'N/A';

                    currentGradesData.push({
                        userid: `${att.quizName} | ${att.usernameStr} - ${att.fullname}`, // Used in CSV
                        grade: gradeVal,
                        qWise: qWise,
                        state: state,
                        date: dateStr,
                        isoDate: isoDate,
                        searchString: `${att.quizName} ${att.usernameStr} ${att.fullname} ${gradeVal} ${qWise} ${state} ${dateStr}`.toLowerCase()
                    });

                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${displayTitle}</td><td><b style="color:var(--primary); font-size: 1.05em">${gradeVal}</b></td><td><div class="q-wise-box">${qWise}</div></td><td>${state}</td><td>${dateStr}</td>`;
                    tbody.appendChild(tr);
                });

                showStatus('success', `Found ${summaryData.length} total quiz attempts for ${targetUserName}!`);
                resWrap.style.display = 'block';

            } catch (error) {
                showStatus('error', `Failed to fetch summary: ${error.message}`);
            }
        });

        // CSV EXPORT LOGIC
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (!currentGradesData.length) return;
            
            // Only export currently VISIBLE rows based on filter
            const query = document.getElementById('tableFilterInput').value.toLowerCase();
            const dateQuery = document.getElementById('dateFilterInput').value;
            
            let csvContent = "data:text/csv;charset=utf-8,Register No / Name,Total Grade,Q-Wise Details,Status,Date Finished\n";
            currentGradesData.forEach(row => {
                let include = true;
                if (query && !row.searchString.includes(query)) include = false;
                if (dateQuery && row.isoDate !== dateQuery) include = false;
                
                if (include) {
                    csvContent += `"${row.userid}",${row.grade},"${row.qWise}",${row.state},"${row.date}"\n`;
                }
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "filtered_quiz_grades.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
