<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jostel Grade Fetcher Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981; /* Emerald green theme for grades */
            --primary-hover: #059669; 
            --logo-dark: rgb(104, 46, 1);
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: rgba(16, 185, 129, 0.2);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(104, 46, 1, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(16, 185, 129, 0.3);
        }

        .header { text-align: center; margin-bottom: 3rem; }
        .header img { height: 80px; margin-bottom: 1.5rem; object-fit: contain; }
        .header h1 { font-size: 2.5rem; font-weight: 600; margin-bottom: 0.5rem; background: linear-gradient(to right, #34d399, #059669); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); font-size: 1.1rem; }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        
        label { font-weight: 600; font-size: 0.9rem; color: #f8fafc; }
        
        input[type="text"], input[type="password"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        input[type="text"]:focus, input[type="password"]:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }

        .btn-generate {
            display: block;
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            margin-top: 1rem;
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.6); }
        .btn-generate:active { transform: translateY(0); }

        .btn-export {
            display: none;
            width: 100%;
            padding: 1rem;
            background: #cbd5e1;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .status { margin-top: 2rem; padding: 1.5rem; border-radius: 12px; display: none; text-align: center; }
        .status.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; display: block;}
        .status.success { background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.2); color: #34d399; display: block;}
        .status.loading { background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); color: #818cf8; display: block;}

        .table-container {
            margin-top: 2rem;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
            display: none;
            border: 1px solid var(--border-color);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; background: rgba(15, 23, 42, 0.6); }
        th, td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(16, 185, 129, 0.1); color: #34d399; position: sticky; top: 0; }
        tr:hover { background: rgba(255,255,255,0.02); }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <img src="./jostel_logo.png" alt="Jostel Logo" onerror="this.style.display='none'">
            <h1>API Grade Fetcher</h1>
            <p>Instantly pull live Quiz grades directly from the Intranet API.</p>
        </div>

        <div class="form-grid">
            <div class="input-group">
                <label>Moodle API Token</label>
                <input type="password" id="apiToken" value="20346d2c25c71285ffc0f147a3f9eab8" placeholder="Paste your 32-character token here">
            </div>
            <div class="input-group">
                <label>Full Quiz URL (from your browser)</label>
                <input type="text" id="quizUrl" value="https://service.sjctni.edu/jostel/moodle/mod/quiz/report.php?id=13199" placeholder="e.g. .../mod/quiz/report.php?id=13199">
            </div>
        </div>

        <button class="btn-generate" id="fetchBtn">Fetch Live Grades!</button>

        <div class="status" id="statusMessage"></div>

        <div class="table-container" id="tableContainer">
            <table id="gradesTable">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody id="gradesBody"></tbody>
            </table>
        </div>
        
        <button class="btn-export" id="exportBtn">Export as CSV</button>
    </div>

    <script>
        let currentGradesData = [];

        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const token = document.getElementById('apiToken').value.trim();
            const urlInput = document.getElementById('quizUrl').value.trim();
            const statusBox = document.getElementById('statusMessage');
            const tableCont = document.getElementById('tableContainer');
            const tbody = document.getElementById('gradesBody');
            const exportBtn = document.getElementById('exportBtn');
            
            // UI Reset
            statusBox.className = 'status loading';
            statusBox.innerHTML = 'Connecting to Moodle API... Please wait.';
            tableCont.style.display = 'none';
            exportBtn.style.display = 'none';
            tbody.innerHTML = '';
            currentGradesData = [];

            if (!token || !urlInput) {
                showStatus('error', 'Please provide both the API token and the Quiz URL.');
                return;
            }

            // Extract the domain and CMID
            let domain = "";
            let cmid = "";
            try {
                const urlObj = new URL(urlInput);
                domain = urlObj.origin + urlObj.pathname.substring(0, urlObj.pathname.indexOf('/mod/'));
                cmid = urlObj.searchParams.get('id');
                
                if (!domain.includes('http') || !cmid) throw new Error("Invalid URL format");
            } catch (e) {
                showStatus('error', 'Could not parse URL. Please ensure it looks like: https://[site]/mod/quiz/report.php?id=123');
                return;
            }

            const apiUrl = `${domain}/webservice/rest/server.php`;

            try {
                // Step 1: Look up the Quiz Instance ID using the CMID
                showStatus('loading', `Looking up database ID for course module ${cmid}...`);
                const cmRes = await fetch(`${apiUrl}?wstoken=${token}&wsfunction=core_course_get_course_module&moodlewsrestformat=json&cmid=${cmid}`);
                const cmData = await cmRes.json();

                if (cmData.exception) {
                    throw new Error(cmData.message || "Failed to resolve Quiz ID from module ID.");
                }

                const quizId = cmData.cm.instance;

                // Step 2: Fetch the grades using the Quiz ID
                showStatus('loading', `Found Quiz ID: ${quizId}. Downloading grades...`);
                const gradesRes = await fetch(`${apiUrl}?wstoken=${token}&wsfunction=mod_quiz_get_user_grades&moodlewsrestformat=json&quizid=${quizId}`);
                const gradesData = await gradesRes.json();

                if (gradesData.exception) {
                    throw new Error(gradesData.message);
                }

                currentGradesData = gradesData.grades || [];

                if (currentGradesData.length === 0) {
                    showStatus('error', `No grades found! The quiz might be empty, or students haven't completed it yet.`);
                    return;
                }

                // Render Table
                currentGradesData.forEach(g => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${g.userid}</td><td><b>${g.grade}</b></td>`;
                    tbody.appendChild(tr);
                });

                showStatus('success', `Successfully pulled ${currentGradesData.length} student grades!`);
                tableCont.style.display = 'block';
                exportBtn.style.display = 'block';

            } catch (error) {
                // Handle CORS errors which are extremely common with browser APIs hitting Moodle
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    showStatus('error', `<b>CORS Block / Network Error:</b><br><br>Your Moodle server security blocks external dashboards from downloading data directly. <br><br><i>Fix: Use this dashboard on the college Intranet, or use the Python script "fetch_grades.py" which bypasses browser security!</i>`);
                } else {
                    showStatus('error', `API Error: ${error.message}`);
                }
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (!currentGradesData.length) return;
            let csvContent = "data:text/csv;charset=utf-8,User ID,Grade\n";
            currentGradesData.forEach(row => {
                csvContent += `${row.userid},${row.grade}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "quiz_grades_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function showStatus(type, message) {
            const statusBox = document.getElementById('statusMessage');
            statusBox.className = `status ${type}`;
            statusBox.innerHTML = message;
        }
    </script>
</body>
</html>
