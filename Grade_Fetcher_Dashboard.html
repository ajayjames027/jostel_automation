<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jostel Grade Fetcher Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669; 
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: rgba(16, 185, 129, 0.2);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(104, 46, 1, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .dashboard {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(16, 185, 129, 0.3);
            transition: all 0.3s;
        }

        .header { text-align: center; margin-bottom: 2rem; }
        .header img { height: 80px; margin-bottom: 1rem; object-fit: contain; }
        .header h1 { font-size: 2.5rem; font-weight: 600; margin-bottom: 0.5rem; background: linear-gradient(to right, #34d399, #059669); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); font-size: 1.1rem; }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        
        label { font-weight: 600; font-size: 0.9rem; color: #f8fafc; }
        
        input[type="text"], input[type="password"], select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
        select option { background: #0f172a; color: white; padding: 10px; }

        .btn-generate {
            display: block;
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.6); }
        
        .btn-export {
            display: block;
            width: 100%;
            padding: 1rem;
            background: #cbd5e1;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .status { margin-top: 1.5rem; padding: 1.5rem; border-radius: 12px; display: none; text-align: center; }
        .status.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; display: block;}
        .status.success { background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.2); color: #34d399; display: block;}
        .status.loading { background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); color: #818cf8; display: block;}

        .table-container {
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        
        .filters-bar {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; background: rgba(15, 23, 42, 0.6); }
        th, td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(16, 185, 129, 0.1); color: #34d399; position: sticky; top: 0; }
        tr:hover { background: rgba(255,255,255,0.05); }

        /* Multi-step logic */
        #step2 { display: none; margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 2rem; }
        #resultsWrapper { display: none; margin-top: 2rem; }
        .hidden-row { display: none !important; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <img src="./jostel_logo.png" alt="Jostel Logo" onerror="this.style.display='none'">
            <h1>Live Grade Fetcher</h1>
            <p>Connect securely using your token to explore all quizzes.</p>
        </div>

        <!-- Step 1: Connect -->
        <div id="step1">
            <div class="form-grid">
                <div class="input-group">
                    <label>Moodle API Token</label>
                    <input type="password" id="apiToken" value="20346d2c25c71285ffc0f147a3f9eab8">
                </div>
                <div class="input-group">
                    <label>Moodle Base URL</label>
                    <input type="text" id="moodleUrl" value="https://service.sjctni.edu/jostel/moodle">
                </div>
            </div>
            <button class="btn-generate" id="connectBtn">Connect to Moodle & Load Quizzes</button>
        </div>

        <div class="status" id="statusMessage"></div>

        <!-- Step 2: Select Quiz and Fetch -->
        <div id="step2">
            <div class="input-group" style="margin-bottom: 1.5rem;">
                <!-- Filter Quizzes -->
                <label>Course/Class Filter (Search Quizzes)</label>
                <input type="text" id="quizSearchInput" placeholder="Type a course or quiz name to filter dropdown..." style="margin-bottom: 0.5rem;">
                
                <select id="quizSelect">
                    <option value="" disabled selected>-- Select a Quiz --</option>
                </select>
            </div>
            
            <button class="btn-generate" id="fetchBtn">Fetch Live Grades</button>
        </div>

        <!-- Results & Filtering Table -->
        <div id="resultsWrapper">
            <div class="filters-bar">
                <div class="input-group">
                    <label>🔍 Smart Filter</label>
                    <input type="text" id="tableFilterInput" placeholder="Filter by Register Number/State...">
                </div>
                <div class="input-group">
                    <label>📅 Date Filter</label>
                    <input type="date" id="dateFilterInput" style="background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); color: white; padding: 1rem; border-radius: 12px; font-family: inherit; outline: none; transition: all 0.3s ease; width: 100%; box-sizing: border-box;">
                </div>
                <div class="input-group">
                    <label>Quick Export</label>
                    <button class="btn-export" id="exportBtn" style="margin: 0; padding: 1rem;">Export CSV</button>
                </div>
            </div>

            <div class="table-container" id="tableContainer">
                <table id="gradesTable">
                    <thead>
                        <tr>
                            <th>Reg. Number</th>
                            <th>Grade</th>
                            <th>Status</th>
                            <th>Date Finished</th>
                        </tr>
                    </thead>
                    <tbody id="gradesBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentGradesData = [];
        let allQuizzes = [];
        let apiToken = "";
        let apiUrl = "";

        // UI Helpers
        function showStatus(type, message) {
            const statusBox = document.getElementById('statusMessage');
            statusBox.className = `status ${type}`;
            statusBox.innerHTML = message;
        }

        function formatUnixTime(unixStamp) {
            if (!unixStamp || unixStamp === 0) return "Not Finished";
            const d = new Date(unixStamp * 1000);
            return d.toLocaleDateString() + " " + d.toLocaleTimeString();
        }

        // STEP 1: LOAD QUIZZES
        document.getElementById('connectBtn').addEventListener('click', async () => {
            apiToken = document.getElementById('apiToken').value.trim();
            const baseUrl = document.getElementById('moodleUrl').value.trim().replace(/\/$/, "");
            apiUrl = `${baseUrl}/webservice/rest/server.php`;

            if (!apiToken || !baseUrl) {
                showStatus('error', 'Token and URL are required.'); return;
            }

            showStatus('loading', 'Connecting to Moodle & gathering quizzes...');
            try {
                const res = await fetch(`${apiUrl}?wstoken=${apiToken}&wsfunction=mod_quiz_get_quizzes_by_courses&moodlewsrestformat=json`);
                const data = await res.json();

                if (data.exception) throw new Error(data.message || "Failed to load quizzes");

                allQuizzes = data.quizzes || [];
                if (allQuizzes.length === 0) {
                    showStatus('error', "Connected successfully, but 0 quizzes were found for your account."); return;
                }

                allQuizzes.sort((a,b) => b.id - a.id); 
                populateQuizDropdown(allQuizzes);

                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                showStatus('success', `Successfully loaded ${allQuizzes.length} Quizzes! Select one below.`);
            } catch (err) {
                if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    showStatus('error', `<b>CORS Block / Network Error</b>`);
                } else {
                    showStatus('error', `Error: ${err.message}`);
                }
            }
        });

        // Filter Quizzes Dropdown
        document.getElementById('quizSearchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allQuizzes.filter(quiz => quiz.name.toLowerCase().includes(q));
            populateQuizDropdown(filtered);
        });

        function populateQuizDropdown(quizzesArray) {
            const sel = document.getElementById('quizSelect');
            sel.innerHTML = '<option value="" disabled selected>-- Choose a Quiz --</option>';
            quizzesArray.forEach(q => {
                const opt = document.createElement('option');
                opt.value = q.id;
                opt.textContent = `[ID: ${q.id}] ${q.name}`;
                sel.appendChild(opt);
            });
        }

        // STEP 2: FETCH GRADES
        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const quizId = document.getElementById('quizSelect').value;
            const resWrap = document.getElementById('resultsWrapper');
            const tbody = document.getElementById('gradesBody');
            
            resWrap.style.display = 'none';
            tbody.innerHTML = '';
            currentGradesData = [];
            document.getElementById('tableFilterInput').value = "";

            if (!quizId) {
                showStatus('error', 'Please select a quiz from the dropdown first!'); return;
            }

            try {
                showStatus('loading', `Downloading live grades for Quiz ID ${quizId}...`);
                const gradesRes = await fetch(`${apiUrl}?wstoken=${apiToken}&wsfunction=mod_quiz_get_user_attempts&moodlewsrestformat=json&quizid=${quizId}&status=all`);
                const gradesData = await gradesRes.json();

                if (gradesData.exception) throw new Error(gradesData.message);

                const attempts = gradesData.attempts || [];
                if (attempts.length === 0) {
                    showStatus('error', `No grades found! No one has attempted this test yet.`);
                    return;
                }

                attempts.forEach(att => {
                    // Only map if it exists
                    const gradeVal = att.sumgrades !== null ? att.sumgrades : 'Ungraded';
                    const dateStr = formatUnixTime(att.timefinish);
                    const state = att.state || "unknown";
                    
                    const dt = (att.timefinish && att.timefinish !== 0) ? new Date(att.timefinish * 1000) : null;
                    let isoDate = "";
                    if (dt) {
                        const year = dt.getFullYear();
                        const month = String(dt.getMonth() + 1).padStart(2, '0');
                        const day = String(dt.getDate()).padStart(2, '0');
                        isoDate = `${year}-${month}-${day}`;
                    }

                    currentGradesData.push({
                        userid: att.userid,
                        grade: gradeVal,
                        state: state,
                        date: dateStr,
                        isoDate: isoDate,
                        searchString: `${att.userid} ${gradeVal} ${state} ${dateStr}`.toLowerCase()
                    });

                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${att.userid}</td><td><b>${gradeVal}</b></td><td>${state}</td><td>${dateStr}</td>`;
                    tbody.appendChild(tr);
                });

                showStatus('success', `Pulled ${currentGradesData.length} records successfully! Use the Smart Filter to sort them.`);
                resWrap.style.display = 'block';

            } catch (error) {
                showStatus('error', `Failed to fetch grades: ${error.message}`);
            }
        });

        // SMART TABLE FILTER LOGIC
        function applyFilters() {
            const query = document.getElementById('tableFilterInput').value.toLowerCase();
            const dateQuery = document.getElementById('dateFilterInput').value;
            const rows = document.getElementById('gradesBody').getElementsByTagName('tr');
            
            for (let i = 0; i < rows.length; i++) {
                let showRow = true;
                const rowData = currentGradesData[i];
                
                // Text search filter
                if (query && !rowData.searchString.includes(query)) {
                    showRow = false;
                }
                
                // Date match filter
                if (dateQuery && rowData.isoDate !== dateQuery) {
                    showRow = false;
                }

                if (showRow) {
                    rows[i].classList.remove('hidden-row');
                } else {
                    rows[i].classList.add('hidden-row');
                }
            }
        }
        
        document.getElementById('tableFilterInput').addEventListener('input', applyFilters);
        document.getElementById('dateFilterInput').addEventListener('change', applyFilters);

        // CSV EXPORT LOGIC
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (!currentGradesData.length) return;
            
            // Only export currently VISIBLE rows based on filter
            const query = document.getElementById('tableFilterInput').value.toLowerCase();
            const dateQuery = document.getElementById('dateFilterInput').value;
            
            let csvContent = "data:text/csv;charset=utf-8,Reg Number,Grade,Status,Date Finished\n";
            currentGradesData.forEach(row => {
                let include = true;
                if (query && !row.searchString.includes(query)) include = false;
                if (dateQuery && row.isoDate !== dateQuery) include = false;
                
                if (include) {
                    csvContent += `${row.userid},${row.grade},${row.state},"${row.date}"\n`;
                }
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "filtered_quiz_grades.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
